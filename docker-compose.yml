name: flood-audit

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:80
    restart: "no"
